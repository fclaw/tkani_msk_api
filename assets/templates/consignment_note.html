<!DOCTYPE html>
<html>
<head>
    <!-- ADD THIS LINE: It's the most critical part for Russian text -->
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; } /* See note on fonts below */
    </style>
</head>
<body>
<div class="header">
    <h1>Накладная №{{ orderId }}</h1>
</div>

<table>
    {% for item in items %}
    <tr>
        <td>{{ item.article }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.length_m }} м</td>
        <td>{{ item.total_price }} ₽</td>
    </tr>
    {% endfor %}
</table>

<div class="footer">
    Итого к оплате: <strong>{{ totalSum }} руб.</strong>
</div>
</body>
</html>
