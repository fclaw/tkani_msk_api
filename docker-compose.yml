version: '3.8'

services:
  # The Database Service
  db:
    image: postgres:15
    container_name: tkani-db
    restart: unless-stopped
    networks:
      - tkani-net
    environment:
      # Credentials read from the .env file
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # This test runs inside the db container to check if Postgres is ready.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports: # Optional: expose the port for local tools like sqitch
      - 5432:5432

  # ... db and api services ...

  migrator:
    image: sqitch/sqitch:latest
    networks:
      - tkani-net
    env_file: .env
    # 1. Force the container to work in this specific folder
    working_dir: /src
    # 2. Mount the current host folder (./) to that folder (/src)
    volumes:
      - ./:/src
    # The command to run
    command: deploy db:pg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy


  # The API Service
  api:
    image: europe-west10-docker.pkg.dev/tkani-479219/tkani-api/tkani-api:latest
    # build: . # Build the image from the Dockerfile in the current directory
    container_name: tkani-api-container
    restart: unless-stopped
    networks:
      - tkani-net
    ports:
      - "${API_EXTERNAL_PORT}:${API_INTERNAL_PORT}"
    environment:
      # The app connects to the 'db' service name on the internal network.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      API_PORT: ${API_INTERNAL_PORT}
      # Re-assert the SSL paths just to be safe
      # SSL OVERRIDES
      # Point to the MOUNTED path inside the container
      SSL_CERT_FILE: /etc/ssl/certs/mounted-bundle.crt
      SYSTEM_CERTIFICATE_PATH: /etc/ssl/certs/mounted-bundle.crt
      NIX_SSL_CERT_FILE: /etc/ssl/certs/mounted-bundle.crt
    env_file: .env
    volumes:
      - ./.env:/app/.env  # Mounts the file (so loadEnv works)
      - ./cacert.pem:/etc/ssl/certs/mounted-bundle.crt:ro
      - tmp_data:/app/tmp # Mount the shared volume
    depends_on:
      db:
        # --- THIS IS THE MAGIC ---
        # This tells docker-compose: "Do NOT start the 'api' service until
        # the 'db' service reports that it is 'healthy'."
        condition: service_healthy
      # 👇 ADD THIS BLOCK 👇
    logging:
      driver: gcplogs
      options:
        gcp-project: "tkani-479219"
        mode: non-blocking       # Don't crash app if Google is slow
        max-buffer-size: "2m"    # Buffer logs before sending
        labels: "service=api"    # Helps you search in the dashboard

  collage-service:
    build: ./collage-service
    restart: always
    volumes:
      - tmp_data:/data # Mount the shared volume
    ports:
      # We only need to expose the port to the internal docker network
      - 5001:5001
    networks:
      - tkani-net # Joins the network


networks:
  tkani-net:
    driver: bridge

volumes:
  postgres-data:
    name: tkani-postgres-data
  tmp_data: # Define the shared volume