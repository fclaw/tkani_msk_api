name: Build and Deploy

on:
  push:
    branches: [ "master", "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west10
  REPO_NAME: tkani-api
  IMAGE: tkani-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Runs on x86_64 Linux (Perfect for your server)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 2. Configure Docker to talk to GCR
    - name: Configure Docker
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # 3. Build Docker Image
    # Note: We rely on Docker caching to make this fast in the future
    - name: Build Docker Image
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE }}:latest .

    # 4. Push to Registry
    - name: Push Docker Image
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    # 5. SSH into Server and Restart
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Stop execution if any error occurs
          set -e
          
          echo "Login to Google Cloud Registry on server..."
          # Ensure the server has permissions (we fixed this in previous steps)
          gcloud auth configure-docker europe-west10-docker.pkg.dev --quiet
          
          echo "Pulling new image..."
          docker pull europe-west10-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tkani-api/tkani-api:latest
          
          echo "Restarting application..."
          # We cd into the folder to find docker-compose.yml
          # CHANGE 'tkani' TO YOUR ACTUAL FOLDER NAME ON SERVER IF DIFFERENT
          cd tkani-api 
          
          # Force pull the latest image referenced in compose
          docker-compose down
          docker-compose up -d
          
          # Prune old images to save disk space on your small server
          docker image prune -f