name: Build and Deploy

on:
  push:
    branches: [ "master", "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west10
  REPO_NAME: tkani-api
  IMAGE: tkani-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Runs on x86_64 Linux (Perfect for your server)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 2. Configure Docker to talk to GCR
    - name: Configure Docker
      run: |
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # 3. Build Docker Image
    # Note: We rely on Docker caching to make this fast in the future
    - name: Build Docker Image
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE }}:latest .

    # 4. Push to Registry
    - name: Push Docker Image
      run: |
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

    # --- ADD THIS STEP ---
    - name: Checkout Code
      uses: actions/checkout@v4

    # NEW STEP: Copy docker-compose.yml to server
    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.yml"
        target: "/home/${{ secrets.SSH_USERNAME }}/tkani-api"

    # 5. SSH into Server and Restart
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          
          echo "Login to Google Cloud Registry on server..."
          gcloud auth configure-docker europe-west10-docker.pkg.dev --quiet
          
          echo "Pulling new image..."
          docker pull europe-west10-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tkani-api/tkani-api:latest
          
          echo "Restarting application..."
          cd tkani-api 
          
          # FIX: Use 'docker compose' (space), not 'docker-compose' (dash)
          docker compose down
          docker compose up -d
          
          # Prune old images
          docker image prune -f